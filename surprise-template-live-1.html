<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A Surprise For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   This is the LIVE template page (the one your downloadUrl
   points to, e.g. https://soravtemps.github.io/YourRepo/).
   It has NO hardcoded name/photo/music — everything below
   is pulled from Firestore using the ?id=... in the URL,
   the same "cards" doc your saveCardData() already writes.

   If the page is opened with NO ?id= (e.g. for previews),
   it falls back to the DEMO values in the DEFAULTS block so
   it still looks good on your store's preview screenshots.
   ========================================================= */

:root{
  --plum:#3a1330;
  --plum-deep:#220a1c;
  --wine:#6e1f45;
  --rose:#e8a6a0;
  --gold:#cf9a49;
  --gold-soft:#e6c789;
  --paper:#fbf3ea;
  --paper-dim:#f1e4d4;
  --ink:#3a2a20;
  --ink-soft:#8a7263;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  min-height:100%;
  background:var(--plum-deep);
  overflow-x:hidden;
  font-family:'Manrope',sans-serif;
  color:var(--paper);
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--gold-soft);color:var(--plum-deep);}
.serif{font-family:'Cormorant Garamond',serif;}
.script{font-family:'Caveat',cursive;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ---------- ambient backdrop ---------- */
#bg{
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(60% 45% at 50% 0%, rgba(207,154,73,.16), transparent 70%),
    radial-gradient(80% 60% at 50% 100%, rgba(110,31,69,.55), transparent 70%),
    linear-gradient(160deg, var(--plum) 0%, var(--plum-deep) 65%);
}
#bg::before{
  content:'';
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:22px 22px;
  opacity:.5;
}
canvas#petals{position:fixed; inset:0; z-index:1; pointer-events:none;}

/* ---------- loading splash ---------- */
#loader{
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px;
  background:var(--plum-deep);
  transition:opacity .5s ease, visibility .5s ease;
}
#loader.hide{opacity:0; visibility:hidden; pointer-events:none;}
.loader-heart{font-size:30px; color:var(--rose); animation:heartbeat 1.3s ease-in-out infinite;}
.loader-text{font-size:13px; color:var(--gold-soft); letter-spacing:.08em;}

/* ---------- stage / screen management ---------- */
.stage{
  position:relative; z-index:2;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:32px 20px 60px;
}
.screen{
  display:none;
  width:100%; max-width:460px;
  text-align:center;
  animation:screenIn .7s cubic-bezier(.2,.8,.2,1) both;
}
.screen.active{display:block;}
@keyframes screenIn{
  from{opacity:0; transform:translateY(18px) scale(.98);}
  to{opacity:1; transform:translateY(0) scale(1);}
}

.eyebrow{
  font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--gold-soft); opacity:.85; margin-bottom:10px;
  font-weight:600;
}
.title-lg{
  font-size:clamp(28px,7vw,40px);
  line-height:1.15;
  font-weight:600;
  color:var(--paper);
}
.title-lg .accent{color:var(--rose); font-style:italic;}
.subtle{color:var(--gold-soft); opacity:.75; font-size:14px; margin-top:8px;}

/* ---------- gift box (screen 1) ---------- */
.gift-wrap{margin:56px auto 30px; width:180px; height:150px; position:relative;}
.gift{position:absolute; inset:0; cursor:pointer; transform-style:preserve-3d; animation:idleFloat 3.4s ease-in-out infinite;}
@keyframes idleFloat{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-7px) rotate(-1.2deg);}}
.gift .box{position:absolute; left:0; right:0; bottom:0; height:92px; background:linear-gradient(135deg,var(--wine),#4c1530 70%); border-radius:8px; box-shadow:0 18px 40px -14px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);}
.gift .lid{position:absolute; left:-8px; right:-8px; top:34px; height:34px; background:linear-gradient(135deg,#7c2653,var(--wine) 70%); border-radius:6px; box-shadow:0 10px 18px -8px rgba(0,0,0,.5); transform-origin:top center; transition:transform .65s cubic-bezier(.6,-0.2,.2,1.3), opacity .5s ease; z-index:3;}
.gift .ribbon-v{position:absolute; left:50%; top:0; bottom:0; width:16px; margin-left:-8px; background:linear-gradient(180deg,var(--gold-soft),var(--gold)); z-index:2;}
.gift .bow{position:absolute; left:50%; top:14px; width:58px; height:34px; margin-left:-29px; z-index:4; transition:transform .5s ease, opacity .4s ease;}
.gift .bow svg{width:100%; height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));}
.gift.opening .lid{transform:rotateX(115deg) translateY(-6px); opacity:0;}
.gift.opening .bow{transform:translateY(-40px) scale(.6) rotate(12deg); opacity:0;}
.gift.opening .glow{opacity:1; transform:scale(1.6);}
.gift .glow{position:absolute; left:50%; top:30%; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:radial-gradient(circle, rgba(255,235,190,.95), rgba(255,235,190,0) 70%); opacity:0; transform:scale(.3); transition:opacity .5s ease, transform .6s ease; filter:blur(2px); pointer-events:none;}
.tap-hint{font-size:13px; color:var(--gold-soft); opacity:.8; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:6px;}
.tap-hint .dot{width:5px; height:5px; border-radius:50%; background:var(--gold-soft); animation:pulseDot 1.4s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{opacity:.25;} 50%{opacity:1;}}

/* ---------- trio reveal (screen 2) ---------- */
.trio{display:flex; justify-content:center; gap:22px; margin:46px 0 10px; flex-wrap:wrap;}
.charm{width:118px; height:130px; background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.12); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; cursor:pointer; position:relative; opacity:0; transform:translateY(24px) scale(.9); animation:charmIn .6s cubic-bezier(.2,.8,.2,1) forwards; transition:transform .25s ease, border-color .25s ease, background .25s ease; backdrop-filter:blur(6px);}
.charm:nth-child(1){animation-delay:.15s;}
.charm:nth-child(2){animation-delay:.35s;}
.charm:nth-child(3){animation-delay:.55s;}
@keyframes charmIn{to{opacity:1; transform:translateY(0) scale(1);}}
.charm:hover{transform:translateY(-4px); border-color:rgba(230,199,137,.5); background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.03));}
.charm .icon{font-size:34px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
.charm .label{font-size:12px; color:var(--gold-soft); letter-spacing:.03em;}
.charm .check{position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%; background:#4caf7d; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; opacity:0; transform:scale(.4); transition:opacity .3s ease, transform .3s cubic-bezier(.4,1.6,.5,1);}
.charm.done .check{opacity:1; transform:scale(1);}
.charm.done{border-color:rgba(76,175,125,.35);}

.progress-row{margin-top:8px; display:flex; justify-content:center; gap:6px;}
.progress-row span{width:26px; height:3px; border-radius:2px; background:rgba(255,255,255,.15); transition:background .3s ease;}
.progress-row span.on{background:var(--gold-soft);}

.cta{margin-top:34px; display:inline-flex; align-items:center; gap:8px; padding:13px 30px; background:linear-gradient(135deg,var(--gold),#b9812f); color:var(--plum-deep); font-weight:700; font-size:14.5px; border:none; border-radius:999px; box-shadow:0 12px 26px -10px rgba(207,154,73,.55); opacity:0; pointer-events:none; transform:translateY(10px); transition:opacity .4s ease, transform .4s ease, box-shadow .2s ease;}
.cta.show{opacity:1; pointer-events:auto; transform:translateY(0);}
.cta:hover{box-shadow:0 14px 30px -8px rgba(207,154,73,.7);}
.cta:active{transform:scale(.97);}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; z-index:20; background:rgba(10,4,9,.72); display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; visibility:hidden; transition:opacity .35s ease;}
.overlay.show{opacity:1; visibility:visible;}
.modal{width:100%; max-width:380px; background:var(--paper); color:var(--ink); border-radius:22px; padding:30px 26px 28px; position:relative; box-shadow:0 40px 80px -20px rgba(0,0,0,.6); transform:translateY(30px) scale(.92); opacity:0; transition:transform .45s cubic-bezier(.2,.9,.25,1.1), opacity .35s ease; max-height:86vh; overflow-y:auto;}
.overlay.show .modal{transform:translateY(0) scale(1); opacity:1;}
.modal-close{position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; border:none; background:rgba(58,42,32,.08); color:var(--ink); font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center;}

.letter-seal{width:52px; height:52px; margin:0 auto 14px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #9b3b32, #6e1f45 75%); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--gold-soft); box-shadow:0 8px 16px -6px rgba(110,31,69,.6), inset 0 0 0 1px rgba(255,255,255,.08);}
.letter-to{text-align:center; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px;}
.letter-body{font-family:'Cormorant Garamond',serif; font-size:19px; line-height:1.65; text-align:center; font-style:italic; min-height:150px; white-space:pre-wrap;}
.letter-body .cursor{display:inline-block; width:2px; background:var(--ink); margin-left:2px; animation:blink 1s step-start infinite;}
@keyframes blink{50%{opacity:0;}}
.letter-sign{margin-top:16px; text-align:right; font-family:'Caveat',cursive; font-size:24px; color:var(--wine);}

.polaroid{background:#fff; padding:12px 12px 44px; border-radius:6px; box-shadow:0 18px 34px -14px rgba(0,0,0,.35); margin:0 auto 6px; max-width:280px; transform:rotate(-1.5deg);}
.polaroid .frame{width:100%; aspect-ratio:1/1; border-radius:2px; overflow:hidden; background:linear-gradient(150deg,#e9d3c4,#c9a98f); display:flex; align-items:center; justify-content:center; position:relative;}
.polaroid .frame img{width:100%; height:100%; object-fit:cover; display:block;}
.polaroid .frame .ph-fallback{color:#8a6a55; font-size:13px; text-align:center; padding:16px; line-height:1.5;}
.polaroid .cap{position:absolute; bottom:10px; left:0; right:0; text-align:center; font-family:'Caveat',cursive; font-size:19px; color:var(--wine);}

.player{background:linear-gradient(160deg,#2b2130,#1a1420); border-radius:18px; padding:20px 18px 22px; color:#f4ecf6;}
.player .now{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:#c9b6d6; text-align:center; margin-bottom:12px;}
.player .art{width:100%; aspect-ratio:1/1; border-radius:12px; margin-bottom:14px; overflow:hidden; background:linear-gradient(150deg,#6e1f45,#3a1330); display:flex; align-items:center; justify-content:center;}
.player .art img{width:100%; height:100%; object-fit:cover;}
.player .art .music-fallback{font-size:46px;}
.song-title{font-weight:700; font-size:16px;}
.song-artist{font-size:13px; color:#c9b6d6; margin-top:2px;}
.bars{display:flex; align-items:flex-end; gap:3px; height:16px; margin-left:auto;}
.bars i{width:3px; background:var(--gold-soft); border-radius:2px; animation:bar 1.1s ease-in-out infinite; animation-play-state:paused;}
.bars.playing i{animation-play-state:running;}
.bars i:nth-child(1){height:40%; animation-delay:0s;}
.bars i:nth-child(2){height:100%; animation-delay:.15s;}
.bars i:nth-child(3){height:60%; animation-delay:.3s;}
.bars i:nth-child(4){height:80%; animation-delay:.45s;}
@keyframes bar{0%,100%{transform:scaleY(.4);} 50%{transform:scaleY(1);}}
.seek{width:100%; height:3px; background:rgba(255,255,255,.16); border-radius:2px; margin-top:14px; position:relative; overflow:hidden; cursor:pointer;}
.seek .fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--gold-soft); border-radius:2px;}
.time-row{display:flex; justify-content:space-between; font-size:11px; color:#b6a3c4; margin-top:5px;}
.controls{display:flex; align-items:center; justify-content:center; gap:22px; margin-top:16px;}
.controls button{background:none; border:none; color:#e8dcee; font-size:18px;}
.controls .play{width:46px; height:46px; border-radius:50%; background:var(--gold-soft); color:var(--plum-deep); display:flex; align-items:center; justify-content:center; font-size:16px;}
.no-music-note{text-align:center; font-size:12px; color:#b6a3c4; margin-top:10px;}

/* ---------- floating background-music toggle ---------- */
.bg-mute{
  position:fixed; bottom:22px; right:18px; z-index:30;
  width:42px; height:42px; border-radius:50%;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(8px);
  color:var(--paper); font-size:16px;
  display:none; align-items:center; justify-content:center;
  transition:transform .2s ease, background .2s ease;
}
.bg-mute.visible{display:flex;}
.bg-mute:active{transform:scale(.9);}
.bg-mute.muted{color:var(--gold-soft);}

/* ---------- final note (screen 3) ---------- */
.heart-big{font-size:40px; color:var(--rose); animation:heartbeat 1.6s ease-in-out infinite;}
@keyframes heartbeat{0%,100%{transform:scale(1);} 15%{transform:scale(1.18);} 30%{transform:scale(1);} 45%{transform:scale(1.12);} 60%{transform:scale(1);}}
.note-card{margin-top:18px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:30px 24px; backdrop-filter:blur(8px);}
.note-body{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:18.5px; line-height:1.7; color:var(--paper); white-space:pre-wrap; min-height:170px;}
.replay{margin-top:22px; background:none; border:1px solid rgba(255,255,255,.3); color:var(--paper); padding:10px 22px; border-radius:999px; font-size:13px; display:inline-flex; gap:8px; align-items:center;}
.made-with{margin-top:26px; font-size:11px; color:rgba(255,255,255,.35); letter-spacing:.05em;}

@media (max-width:380px){ .charm{width:100px; height:118px;} }
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="petals"></canvas>

<div id="loader">
  <div class="loader-heart">♥</div>
  <div class="loader-text">Preparing your surprise…</div>
</div>

<div class="stage">

  <!-- SCREEN 1 — gift box -->
  <section class="screen" id="screen-1">
    <p class="eyebrow" id="s1-from"></p>
    <h1 class="title-lg">Something special<br>for <span class="accent" id="s1-name">You</span></h1>
    <div class="gift-wrap">
      <div class="gift" id="gift">
        <div class="glow"></div>
        <div class="bow"><svg viewBox="0 0 58 34"><path d="M29 34 C29 20 5 22 5 8 C5 -2 22 -2 29 12 C36 -2 53 -2 53 8 C53 22 29 20 29 34 Z" fill="#e6c789" stroke="#cf9a49" stroke-width="1.2"/></svg></div>
        <div class="ribbon-v"></div>
        <div class="lid"></div>
        <div class="box"></div>
      </div>
    </div>
    <p class="tap-hint"><span class="dot"></span> Tap the gift to open</p>
  </section>

  <!-- SCREEN 2 — trio reveal -->
  <section class="screen" id="screen-2">
    <p class="eyebrow">You found them, <span id="s2-name">love</span></p>
    <h1 class="title-lg">Tap each one to<br>discover something</h1>
    <div class="trio">
      <div class="charm" data-modal="letter"><span class="check">✓</span><div class="icon">💌</div><div class="label">A letter</div></div>
      <div class="charm" data-modal="photo"><span class="check">✓</span><div class="icon">📷</div><div class="label">A memory</div></div>
      <div class="charm" data-modal="music"><span class="check">✓</span><div class="icon">🎵</div><div class="label">Our song</div></div>
    </div>
    <div class="progress-row"><span data-p="letter"></span><span data-p="photo"></span><span data-p="music"></span></div>
    <button class="cta" id="continue-btn">Continue <span>🌸</span></button>
  </section>

  <!-- SCREEN 3 — final note -->
  <section class="screen" id="screen-3">
    <div class="heart-big">♥</div>
    <p class="eyebrow" style="margin-top:14px;">A note just for you</p>
    <h1 class="title-lg" id="s3-name">For You</h1>
    <div class="note-card"><p class="note-body" id="final-note"></p></div>
    <button class="replay" id="replay-btn">↺ Replay</button>
    <p class="made-with">made with care, just for you</p>
  </section>

</div>

<div class="overlay" id="overlay"><div class="modal" id="modal-body"></div></div>

<!-- Background music toggle — the SAME song chosen in the customize form
     (CARD.musicUrl) plays quietly through the whole page from the moment
     the gift is opened (a real tap, so browsers allow sound). This button
     just lets the visitor mute it without losing their place. -->
<button class="bg-mute" id="bg-mute" title="Mute background music">🔊</button>

<!-- ============================================================
     LIVE DATA — fetches the saved card by ?id= from Firestore.
     Uses the exact same Firebase project as your main site, so
     nothing extra needs to be set up.
============================================================ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

// Same project as your main "Sorav Temps" site — do not change.
const firebaseConfig = {
  apiKey: "AIzaSyCRAO7UDddkFKvKbGGBBtkruD22NZnNozU",
  authDomain: "soravtemps-d5419.firebaseapp.com",
  projectId: "soravtemps-d5419",
  storageBucket: "soravtemps-d5419.firebasestorage.app",
  messagingSenderId: "889624784593",
  appId: "1:889624784593:web:3a325467962639facedff0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// DEMO fallback — shown only when the page is opened with no ?id=
// (store preview screenshots, or you testing the template directly).
const DEFAULTS = {
  recipientName: "Anshika",
  senderName: "Krish",
  letter: "To my favorite person...\n\nThank you for making life feel so beautiful. Every moment with you becomes a memory I'll always cherish.\n\nI'm so lucky to have you.",
  photoCaption: "You make every moment special ♥",
  photoSrc: "",
  finalNote: "Always keep smiling, okay? 🌸 You deserve every bit of happiness this world has to offer.\n\nThank you for standing by my side, for loving me, and for making my life so much more beautiful.\n\nAnd one last thing before this little surprise ends...\n\nI love you sooooo, sooo much. ♾",
  musicUrl: "",       // background track — user-uploaded mp3, saved under `music` in Firestore
  revealSongUrl: ""   // surprise song — a SEPARATE user-uploaded mp3, saved under `revealSong`,
                       // plays once as a "ta-da" the moment the gift box is tapped open
};

window.CARD = { ...DEFAULTS };

async function loadCard(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if(id){
    try{
      const snap = await getDoc(doc(db, "cards", id));
      if(snap.exists()){
        const d = snap.data();
        window.CARD.recipientName = d.name || DEFAULTS.recipientName;
        window.CARD.senderName    = d.from || DEFAULTS.senderName;
        window.CARD.letter        = d.letter || d.message || DEFAULTS.letter;
        window.CARD.finalNote     = d.finalNote || d.memory || DEFAULTS.finalNote;
        window.CARD.photoSrc      = (d.photoUrls && d.photoUrls[0]) ? d.photoUrls[0] : DEFAULTS.photoSrc;
        window.CARD.musicUrl      = d.music || DEFAULTS.musicUrl;
        window.CARD.revealSongUrl = d.revealSong || DEFAULTS.revealSongUrl;
      }
    }catch(err){
      console.warn('Could not load card, showing demo instead:', err);
    }
  }

  window.dispatchEvent(new Event('card-ready'));
}
loadCard();
</script>

<!-- ============================================================
     TEMPLATE BEHAVIOUR — gift box, reveal cards, letter/photo/
     music modals, typewriter text, confetti, ambient petals.
     Waits for the "card-ready" event above before touching the DOM.
============================================================ -->
<script>
// ---------- background music (shared across the whole page + the modal) ----------
// One single Audio instance for the entire visit. Created here but only
// .play()'d on the gift-box tap below, because that tap is a real user
// gesture — browsers require one before they'll allow audio with sound.
let bgAudio = null;
const muteBtn = document.getElementById('bg-mute');

function setupBackgroundMusic(CARD){
  if(!CARD.musicUrl) return; // no song uploaded for this card — stay silent
  bgAudio = new Audio(CARD.musicUrl);
  bgAudio.loop = true;
  bgAudio.volume = 0.55;
  muteBtn.classList.add('visible');
}

// ---------- surprise music (one-shot "ta-da" the instant the gift opens) ----------
// A SEPARATE track from the background song above. Plays once, at full
// volume, the moment the gift box is tapped — then the looping background
// song (if any) takes over for the rest of the visit.
let revealAudio = null;
function setupRevealMusic(CARD){
  if(!CARD.revealSongUrl) return; // no surprise song uploaded — skip silently
  revealAudio = new Audio(CARD.revealSongUrl);
  revealAudio.volume = 0.85;
}

muteBtn.addEventListener('click', ()=>{
  if(!bgAudio) return;
  bgAudio.muted = !bgAudio.muted;
  muteBtn.textContent = bgAudio.muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('muted', bgAudio.muted);
});

window.addEventListener('card-ready', () => {
  const CARD = window.CARD;

  document.getElementById('s1-from').textContent = 'From ' + CARD.senderName;
  document.getElementById('s1-name').textContent = CARD.recipientName;
  document.getElementById('s2-name').textContent = CARD.recipientName;
  document.getElementById('s3-name').textContent = 'For ' + CARD.recipientName;

  setupBackgroundMusic(CARD);
  setupRevealMusic(CARD);

  document.getElementById('loader').classList.add('hide');
  goTo('screen-1');
});

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

const gift = document.getElementById('gift');
gift.addEventListener('click', ()=>{
  if(gift.classList.contains('opening')) return;
  gift.classList.add('opening');
  burstConfetti(gift.getBoundingClientRect());
  // This tap is the "real user gesture" browsers wait for — safe to start
  // audio right here.
  if(revealAudio){
    // Surprise song plays once as the "ta-da" moment; the looping background
    // song (if any) fades in right after it finishes, instead of overlapping.
    revealAudio.currentTime = 0;
    revealAudio.play().catch(()=>{ /* still blocked — mute icon stays, visitor can tap it */ });
    revealAudio.addEventListener('ended', ()=>{
      if(bgAudio) bgAudio.play().catch(()=>{});
    }, { once:true });
  } else if(bgAudio){
    bgAudio.play().catch(()=>{ /* still blocked — mute icon stays, visitor can tap it */ });
  }
  setTimeout(()=>goTo('screen-2'), 620);
});

const state = { letter:false, photo:false, music:false };
const charms = document.querySelectorAll('.charm');
const continueBtn = document.getElementById('continue-btn');

function updateProgress(){
  Object.keys(state).forEach(k=>{
    document.querySelector(`.progress-row span[data-p="${k}"]`).classList.toggle('on', state[k]);
  });
  if(Object.values(state).every(Boolean)) continueBtn.classList.add('show');
}

charms.forEach(ch=>{
  ch.addEventListener('click', ()=>{
    const key = ch.dataset.modal;
    state[key] = true;
    ch.classList.add('done');
    updateProgress();
    openModal(key);
  });
});
continueBtn.addEventListener('click', ()=>{ goTo('screen-3'); typeFinalNote(); });

const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modal-body');

function closeModal(){
  overlay.classList.remove('show');
  // bgAudio deliberately keeps playing after the modal closes — it's the
  // background track for the whole page, not just this card's controls.
}
overlay.addEventListener('click', e=>{ if(e.target === overlay) closeModal(); });

function openModal(kind){
  const CARD = window.CARD;
  if(kind === 'letter') modalBody.innerHTML = letterMarkup(CARD);
  if(kind === 'photo')  modalBody.innerHTML = photoMarkup(CARD);
  if(kind === 'music')  modalBody.innerHTML = musicMarkup(CARD);
  overlay.classList.add('show');
  modalBody.querySelector('.modal-close').addEventListener('click', closeModal);

  if(kind === 'letter') typeText(modalBody.querySelector('.letter-body'), CARD.letter, 22);
  if(kind === 'music')  startPlayer(modalBody, CARD);
}

function letterMarkup(CARD){
  return `
    <button class="modal-close">✕</button>
    <div class="letter-seal">♥</div>
    <p class="letter-to">For ${CARD.recipientName}</p>
    <p class="letter-body"></p>
    <p class="letter-sign">— ${CARD.senderName}</p>
  `;
}

function photoMarkup(CARD){
  const img = CARD.photoSrc
    ? `<img src="${CARD.photoSrc}" alt="memory">`
    : `<div class="ph-fallback">📷<br>No photo was<br>added to this card</div>`;
  return `
    <button class="modal-close">✕</button>
    <div class="polaroid">
      <div class="frame">${img}</div>
      <p class="cap">${CARD.photoCaption || 'You make every moment special ♥'}</p>
    </div>
  `;
}

function musicMarkup(CARD){
  if(!CARD.musicUrl || !bgAudio){
    return `
      <button class="modal-close">✕</button>
      <div class="player">
        <p class="now">Playing just for ${CARD.recipientName}</p>
        <div class="art"><div class="music-fallback">🎵</div></div>
        <div class="song-title">No song chosen</div>
        <p class="no-music-note">This card was made without a background song.</p>
      </div>
    `;
  }
  return `
    <button class="modal-close">✕</button>
    <div class="player">
      <p class="now">Playing just for ${CARD.recipientName}</p>
      <div class="art"><div class="music-fallback">🎵</div></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div>
          <div class="song-title">${CARD.songLabel}</div>
          <div class="song-artist">${CARD.senderName}'s pick</div>
        </div>
        <div class="bars" id="eq-bars"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="seek" id="seek-bar"><div class="fill" id="seek-fill"></div></div>
      <div class="time-row"><span id="time-now">0:00</span><span id="time-total">0:00</span></div>
      <div class="controls">
        <button id="rewind-btn">⏮</button>
        <button class="play" id="play-btn">▶</button>
        <button id="forward-btn">⏭</button>
      </div>
    </div>
  `;
}

// This does NOT create a new Audio — it wires the modal's UI to the single
// bgAudio instance already playing in the background, so play/pause/seek
// here control the exact same song the whole page is listening to.
function startPlayer(root, CARD){
  if(!CARD.musicUrl || !bgAudio) return;

  const fill = root.querySelector('#seek-fill');
  const seekBar = root.querySelector('#seek-bar');
  const timeNow = root.querySelector('#time-now');
  const timeTotal = root.querySelector('#time-total');
  const playBtn = root.querySelector('#play-btn');
  const bars = root.querySelector('#eq-bars');

  function fmt(s){
    if(!isFinite(s)) return '0:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + ':' + String(sec).padStart(2,'0');
  }
  function syncPlayState(){
    const playing = !bgAudio.paused;
    playBtn.textContent = playing ? '⏸' : '▶';
    bars.classList.toggle('playing', playing);
  }

  if(isFinite(bgAudio.duration)) timeTotal.textContent = fmt(bgAudio.duration);
  timeNow.textContent = fmt(bgAudio.currentTime);
  fill.style.width = ((bgAudio.currentTime / bgAudio.duration) * 100 || 0) + '%';
  syncPlayState();

  const onLoaded = ()=> timeTotal.textContent = fmt(bgAudio.duration);
  const onTime = ()=>{
    fill.style.width = ((bgAudio.currentTime / bgAudio.duration) * 100 || 0) + '%';
    timeNow.textContent = fmt(bgAudio.currentTime);
  };
  bgAudio.addEventListener('loadedmetadata', onLoaded);
  bgAudio.addEventListener('timeupdate', onTime);
  bgAudio.addEventListener('play', syncPlayState);
  bgAudio.addEventListener('pause', syncPlayState);

  // clean up listeners once this modal instance is gone, so repeated
  // opens don't stack duplicate handlers on the shared audio object
  overlay.addEventListener('transitionend', function cleanup(){
    if(overlay.classList.contains('show')) return;
    bgAudio.removeEventListener('loadedmetadata', onLoaded);
    bgAudio.removeEventListener('timeupdate', onTime);
    bgAudio.removeEventListener('play', syncPlayState);
    bgAudio.removeEventListener('pause', syncPlayState);
    overlay.removeEventListener('transitionend', cleanup);
  }, { once:true });

  playBtn.addEventListener('click', ()=>{
    if(bgAudio.paused) bgAudio.play().catch(()=>{});
    else bgAudio.pause();
  });
  root.querySelector('#rewind-btn').addEventListener('click', ()=>{
    bgAudio.currentTime = Math.max(0, bgAudio.currentTime - 5);
  });
  root.querySelector('#forward-btn').addEventListener('click', ()=>{
    bgAudio.currentTime = Math.min(bgAudio.duration || 0, bgAudio.currentTime + 5);
  });
  seekBar.addEventListener('click', (e)=>{
    const rect = seekBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if(isFinite(bgAudio.duration)) bgAudio.currentTime = pct * bgAudio.duration;
  });
}

function typeText(el, text, speed){
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  let i = 0;
  function step(){
    if(i <= text.length){
      el.textContent = text.slice(0, i);
      el.appendChild(cursor);
      i++;
      setTimeout(step, speed);
    } else {
      cursor.remove();
    }
  }
  step();
}

function typeFinalNote(){
  typeText(document.getElementById('final-note'), window.CARD.finalNote, 18);
}

document.getElementById('replay-btn').addEventListener('click', ()=>{
  gift.classList.remove('opening');
  Object.keys(state).forEach(k=>state[k]=false);
  charms.forEach(c=>c.classList.remove('done'));
  document.querySelectorAll('.progress-row span').forEach(s=>s.classList.remove('on'));
  continueBtn.classList.remove('show');
  goTo('screen-1');
});

function burstConfetti(rect){
  const colors = ['#e6c789','#cf9a49','#e8a6a0','#f4ecf6'];
  for(let i=0; i<26; i++){
    const p = document.createElement('div');
    const size = 6 + Math.random()*6;
    p.style.position = 'fixed';
    p.style.left = (rect.left + rect.width/2) + 'px';
    p.style.top  = (rect.top + rect.height/2) + 'px';
    p.style.width = size + 'px';
    p.style.height = size*1.3 + 'px';
    p.style.background = colors[i % colors.length];
    p.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    p.style.zIndex = 15;
    p.style.pointerEvents = 'none';
    document.body.appendChild(p);

    const angle = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random()*160;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 60;
    const rot = (Math.random()-0.5) * 720;
    const dur = 900 + Math.random()*500;

    p.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy + 220}px) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: dur, easing: 'cubic-bezier(.25,.7,.3,1)' });

    setTimeout(()=>p.remove(), dur + 50);
  }
}

const canvas = document.getElementById('petals');
const ctx = canvas.getContext('2d');
let petals = [];
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);
function makePetal(){
  return { x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height, r: 3 + Math.random()*4, speed: 0.4 + Math.random()*0.7, drift: (Math.random()-0.5)*0.6, sway: Math.random()*Math.PI*2, color: Math.random() > 0.5 ? 'rgba(232,166,160,' : 'rgba(230,199,137,' };
}
for(let i=0;i<28;i++) petals.push(makePetal());
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  petals.forEach(p=>{
    p.y += p.speed;
    p.sway += 0.02;
    p.x += Math.sin(p.sway) * 0.4 + p.drift * 0.1;
    if(p.y > canvas.height + 20){ p.y = -20; p.x = Math.random()*canvas.width; }
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r, p.r*1.4, p.sway, 0, Math.PI*2);
    ctx.fillStyle = p.color + '0.35)';
    ctx.fill();
  });
  requestAnimationFrame(loop);
}
loop();
</script>
